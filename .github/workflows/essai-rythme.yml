name: Essai rythme
on: workflow_dispatch
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts
      - run: python3 tools/essai_rythme.py
      - run: |
          git config user.name "audio-bot"; git config user.email "audio-bot@users.noreply.github.com"
          git add essai/*.mp3
          git commit -q -m "Extraits d'essai du rythme" || true
          git pull --rebase -q origin main; git push origin HEAD:main
