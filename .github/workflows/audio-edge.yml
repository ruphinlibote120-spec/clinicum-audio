name: Audios Ariane
on:
  push:
    branches: [main]
    paths: ['tools/lot.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: audio-edge
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts
      - name: Générer
        run: python3 tools/gen_edge.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "audio-bot"; git config user.email "audio-bot@users.noreply.github.com"
          git add -A audio
          if ! git diff --cached --quiet; then git commit -m "Audios Ariane (lot)"; git pull --rebase -q origin main; git push origin HEAD:main; fi
