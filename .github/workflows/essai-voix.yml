name: Essai voix
on:
  push:
    branches: [essai-voix]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts
      - run: python3 tools/gen_compare.py
        env:
          INTRO: "1"
      - run: |
          git config user.name "audio-bot"; git config user.email "audio-bot@users.noreply.github.com"
          git add -f essai-voix/compare 2>/dev/null || true; git commit -m "Audio essai" || true; git push origin HEAD:essai-voix
